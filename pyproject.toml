[project]
name = "agent-memory-api"
version = "0.1.0"
description = "FastAPI and LangGraph agent with persistent memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "langchain-openai",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]",
  "python-dotenv",
  "python-multipart",
  "pydantic-settings",
  "httpx",
  "imageio-ffmpeg",
  "pillow",
  "python-docx",
  "pdf2docx",
  "openpyxl",
  "reportlab",
  "pypdf",
  "pdfplumber",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
tools = [
  "langchain-mcp-adapters",
  "mcp",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["runtime*", "searxng*", "cookie_manager*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
