<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astral Voyages Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                heading: ["Instrument Serif", "serif"],
                body: ["Barlow", "sans-serif"],
              },
              borderRadius: {
                DEFAULT: "9999px",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
    <script>window.Motion = window.Motion || window.FramerMotion;</script>
    <style>
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #000; color: #fff; font-family: "Barlow", sans-serif; }
      * { box-sizing: border-box; }
      .liquid-glass {
        background: rgba(255,255,255,0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: none;
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        position: relative;
        overflow: hidden;
      }
      .liquid-glass::before {
        content: "";
        position: absolute; inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .liquid-glass-strong {
        background: rgba(255,255,255,0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(50px);
        -webkit-backdrop-filter: blur(50px);
        border: none;
        box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
        position: relative;
        overflow: hidden;
      }
      .liquid-glass-strong::before {
        content: "";
        position: absolute; inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .chat-scroll::-webkit-scrollbar { width: 6px; }
      .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); border-radius: 9999px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;
      const { motion } = window.Motion;

      function ArrowUpRight({ className = "h-5 w-5" }) {
        return (
          <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M7 17L17 7" />
            <path d="M7 7h10v10" />
          </svg>
        );
      }

      function PlayIcon({ className = "h-4 w-4" }) {
        return (
          <svg viewBox="0 0 24 24" className={className} fill="currentColor" aria-hidden="true">
            <polygon points="6 4 20 12 6 20 6 4" />
          </svg>
        );
      }

      function MaterialIcon({ path }) {
        return (
          <svg viewBox="0 0 24 24" className="h-6 w-6 text-white" fill="currentColor" aria-hidden="true">
            <path d={path} />
          </svg>
        );
      }

      function FadingVideo({ src, className, style }) {
        const videoRef = useRef(null);
        const rafRef = useRef(null);
        const fadingOutRef = useRef(false);
        const endedTimerRef = useRef(null);
        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        useEffect(() => {
          const video = videoRef.current;
          if (!video) return;

          function fadeTo(target, duration) {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            const startOpacity = Number.parseFloat(video.style.opacity || "0") || 0;
            const start = performance.now();
            const tick = (now) => {
              const progress = Math.min((now - start) / duration, 1);
              video.style.opacity = String(startOpacity + (target - startOpacity) * progress);
              if (progress < 1) {
                rafRef.current = requestAnimationFrame(tick);
              }
            };
            rafRef.current = requestAnimationFrame(tick);
          }

          function onLoadedData() {
            video.style.opacity = "0";
            video.play();
            fadeTo(1, FADE_MS);
          }

          function onTimeUpdate() {
            if (!video.duration || fadingOutRef.current) return;
            const remaining = video.duration - video.currentTime;
            if (remaining <= FADE_OUT_LEAD && remaining > 0) {
              fadingOutRef.current = true;
              fadeTo(0, FADE_MS);
            }
          }

          function onEnded() {
            video.style.opacity = "0";
            endedTimerRef.current = setTimeout(() => {
              video.currentTime = 0;
              video.play();
              fadingOutRef.current = false;
              fadeTo(1, FADE_MS);
            }, 100);
          }

          video.addEventListener("loadeddata", onLoadedData);
          video.addEventListener("timeupdate", onTimeUpdate);
          video.addEventListener("ended", onEnded);
          if (video.readyState >= 2) onLoadedData();

          return () => {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            if (endedTimerRef.current) clearTimeout(endedTimerRef.current);
            video.removeEventListener("loadeddata", onLoadedData);
            video.removeEventListener("timeupdate", onTimeUpdate);
            video.removeEventListener("ended", onEnded);
          };
        }, [src]);

        return <video ref={videoRef} src={src} className={className} style={{ ...style, opacity: 0 }} autoPlay muted playsInline preload="auto" />;
      }

      function BlurText({ text, className }) {
        const ref = useRef(null);
        const [visible, setVisible] = useState(false);
        const words = text.split(" ");

        useEffect(() => {
          const node = ref.current;
          if (!node) return;
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          }, { threshold: 0.1 });
          observer.observe(node);
          return () => observer.disconnect();
        }, []);

        return (
          <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
            {words.map((word, index) => (
              <motion.span
                key={`${word}-${index}`}
                initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
                animate={visible ? {
                  filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                  opacity: [0, 0.5, 1],
                  y: [50, -5, 0],
                } : {}}
                transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: index * 0.1 }}
                style={{ display: "inline-block", marginRight: "0.28em" }}
              >
                {word}
              </motion.span>
            ))}
          </p>
        );
      }

      function Navbar() {
        const links = ["Home", "Voyages", "Worlds", "Innovation", "Plan Launch"];
        return (
          <nav className="fixed top-4 left-0 right-0 z-50 px-8 lg:px-16">
            <div className="mx-auto flex max-w-7xl items-center justify-between">
              <div className="liquid-glass flex h-12 w-12 items-center justify-center rounded-full font-heading text-3xl italic text-white">a</div>
              <div className="liquid-glass hidden items-center gap-1 rounded-full px-1.5 py-1.5 md:flex">
                {links.map((link) => (
                  <a key={link} href={link === "Home" ? "#hero" : "#capabilities"} className="px-3 py-2 font-body text-sm font-medium text-white/90">{link}</a>
                ))}
                <a href="#chat" className="flex items-center gap-2 rounded-full bg-white px-4 py-2 font-body text-sm font-semibold whitespace-nowrap text-black">
                  Claim a Spot <ArrowUpRight className="h-4 w-4" />
                </a>
              </div>
              <div className="h-12 w-12" aria-hidden="true"></div>
            </div>
          </nav>
        );
      }

      function ChatPanel() {
        const greeting = { role: "assistant", text: "Mission control is online. Ask about LangGraph, voyages, or your next build." };
        const [threadId] = useState(() => {
          const existing = window.localStorage.getItem("agent_thread_id");
          if (existing) return existing;
          const created = `thread-${crypto.randomUUID ? crypto.randomUUID() : Date.now()}`;
          window.localStorage.setItem("agent_thread_id", created);
          return created;
        });
        const [userId] = useState(() => {
          const existing = window.localStorage.getItem("agent_user_id");
          if (existing) return existing;
          const created = `user-${crypto.randomUUID ? crypto.randomUUID() : Date.now()}`;
          window.localStorage.setItem("agent_user_id", created);
          return created;
        });
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const listRef = useRef(null);

        useEffect(() => {
          let cancelled = false;

          async function loadHistory() {
            try {
              const response = await fetch(`/chat/${threadId}`);
              if (!response.ok) throw new Error(`History request failed: ${response.status}`);
              const data = await response.json();
              if (cancelled) return;
              setMessages(data.messages && data.messages.length ? data.messages : [greeting]);
            } catch (err) {
              if (!cancelled) setMessages([greeting]);
            }
          }

          loadHistory();
          return () => {
            cancelled = true;
          };
        }, [threadId]);

        useEffect(() => {
          if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
        }, [messages, loading]);

        async function sendMessage(event) {
          event.preventDefault();
          const text = input.trim();
          if (!text || loading) return;
          setInput("");
          setError("");
          setMessages((current) => [...current, { role: "user", text }]);
          setLoading(true);

          try {
            const response = await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: userId, thread_id: threadId, message: text }),
            });
            if (!response.ok) throw new Error(`Chat request failed: ${response.status}`);
            const data = await response.json();
            setMessages((current) => [...current, { role: "assistant", text: data.reply || "No reply returned." }]);
          } catch (err) {
            setError("Transmission failed. Check the FastAPI server and model gateway.");
          } finally {
            setLoading(false);
          }
        }

        return (
          <motion.aside
            id="chat"
            data-testid="chat-panel"
            initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
            whileInView={{ filter: "blur(0px)", opacity: 1, y: 0 }}
            viewport={{ once: true, amount: 0.2 }}
            transition={{ duration: 0.75, ease: "easeOut", delay: 0.2 }}
            className="liquid-glass-strong w-full max-w-[630px] rounded-[1.5rem] p-4 text-left"
          >
            <div className="mb-3 flex items-center justify-between">
              <div>
                <p className="font-body text-xs font-medium uppercase tracking-[0.18em] text-white/60">AI Mission Console</p>
                <h2 className="font-heading text-3xl italic leading-[1.1] text-white">Ask the agent</h2>
              </div>
              <div className="liquid-glass flex h-10 w-10 items-center justify-center rounded-full text-white">
                <ArrowUpRight className="h-5 w-5" />
              </div>
            </div>
            <div ref={listRef} className="chat-scroll flex h-[520px] flex-col gap-3 overflow-y-auto pr-1">
              {messages.map((message, index) => (
                <div key={`${message.role}-${index}`} className={`max-w-[86%] rounded-[1.1rem] px-4 py-3 font-body text-sm leading-snug ${message.role === "user" ? "ml-auto bg-white text-black" : "liquid-glass text-white/95"}`}>
                  {message.text}
                </div>
              ))}
              {loading && <div className="liquid-glass max-w-[72%] rounded-[1.1rem] px-4 py-3 font-body text-sm text-white/80">Receiving signal...</div>}
            </div>
            {error && <p className="mt-3 font-body text-xs text-white/80">{error}</p>}
            <form onSubmit={sendMessage} className="mt-4 flex items-center gap-2">
              <input
                value={input}
                onChange={(event) => setInput(event.target.value)}
                placeholder="Ask about LangGraph or memory..."
                className="liquid-glass min-w-0 flex-1 rounded-full px-4 py-3 font-body text-sm text-white outline-none placeholder:text-white/45 focus:shadow-[inset_0_0_0_1px_rgba(255,255,255,.35)]"
              />
              <button type="submit" disabled={loading} className="liquid-glass-strong flex h-12 w-12 shrink-0 items-center justify-center rounded-full text-white disabled:opacity-55">
                <ArrowUpRight className="h-5 w-5" />
              </button>
            </form>
          </motion.aside>
        );
      }

      function Hero() {
        return (
          <section id="hero" className="relative flex min-h-[100dvh] overflow-hidden bg-black">
            <FadingVideo
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"
              className="absolute left-1/2 top-0 z-0 -translate-x-1/2 object-cover object-top"
              style={{ width: "120%", height: "120%" }}
            />
            <div className="relative z-10 flex min-h-[100dvh] w-full flex-col">
              <Navbar />
              <div className="hero-chat-center flex flex-1 items-center justify-center px-4 pt-24">
                <div className="flex w-full max-w-[690px] justify-center">
                  <ChatPanel />
                </div>
              </div>
            </div>
          </section>
        );
      }

      function StatCard({ number, label, icon }) {
        return (
          <div className="liquid-glass w-[220px] rounded-[1.25rem] p-5">
            <div className="mb-5 h-7 w-7 text-white">
              {icon === "clock" ? (
                <svg viewBox="0 0 24 24" className="h-7 w-7" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
              ) : (
                <svg viewBox="0 0 24 24" className="h-7 w-7" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c2.4 2.6 3.6 5.6 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3Z" /></svg>
              )}
            </div>
            <p className="font-heading text-4xl italic leading-none tracking-[-1px] text-white">{number}</p>
            <p className="mt-2 font-body text-xs font-light text-white">{label}</p>
          </div>
        );
      }

      function Capabilities() {
        const cards = [
          {
            title: "AI Scenery",
            body: "AI analyzes your product to create indistinguishable natural environments, from Icelandic cliffs to misty forests.",
            icon: "M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z",
            tags: ["Natural Context", "Photo Realism", "Infinite Settings", "Eco-Vibe"],
          },
          {
            title: "Batch Production",
            body: "Style your entire product line in minutes. Create a unified visual identity for catalogues and social media without weeks of retouching.",
            icon: "M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z",
            tags: ["Scale Fast", "Visual Consistency", "Time Saver", "Ready to Post"],
          },
          {
            title: "Smart Lighting",
            body: "Automatic lighting and material adjustment. Achieve flawless integration with realistic shadows and sunlight.",
            icon: "M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z",
            tags: ["Ray Tracing", "Physical Shadows", "Studio Quality", "Sunlight Sync"],
          },
        ];

        return (
          <section id="capabilities" className="relative min-h-[100dvh] overflow-hidden bg-black">
            <FadingVideo
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
              className="absolute inset-0 z-0 h-full w-full object-cover"
            />
            <div className="relative z-10 flex min-h-[100dvh] flex-col px-8 pb-10 pt-24 md:px-16 lg:px-20">
              <motion.header initial={{ filter: "blur(10px)", opacity: 0, y: 20 }} whileInView={{ filter: "blur(0px)", opacity: 1, y: 0 }} viewport={{ once: true, amount: 0.25 }} transition={{ duration: 0.7, ease: "easeOut" }} className="mb-auto">
                <p className="mb-6 font-body text-sm text-white/80">// Capabilities</p>
                <h2 className="pb-1 font-heading text-6xl italic leading-[0.96] tracking-[-3px] text-white md:text-7xl lg:text-[6rem]">
                  Production<br />evolved
                </h2>
              </motion.header>
              <div className="mt-16 grid grid-cols-1 gap-6 md:grid-cols-3">
                {cards.map((card, index) => (
                  <motion.article
                    key={card.title}
                    initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
                    whileInView={{ filter: "blur(0px)", opacity: 1, y: 0 }}
                    viewport={{ once: true, amount: 0.2 }}
                    transition={{ duration: 0.7, ease: "easeOut", delay: index * 0.12 }}
                    className="liquid-glass flex min-h-[360px] flex-col rounded-[1.25rem] p-6"
                  >
                    <div className="flex items-start justify-between gap-4">
                      <div className="liquid-glass flex h-11 w-11 shrink-0 items-center justify-center rounded-[0.75rem]">
                        <MaterialIcon path={card.icon} />
                      </div>
                      <div className="flex max-w-[70%] flex-wrap justify-end gap-1.5">
                        {card.tags.map((tag) => <span key={tag} className="liquid-glass rounded-full px-3 py-1 font-body text-[11px] text-white/90 whitespace-nowrap">{tag}</span>)}
                      </div>
                    </div>
                    <div className="flex-1"></div>
                    <div className="mt-6">
                      <h3 className="font-heading text-3xl italic leading-none tracking-[-1px] text-white md:text-4xl">{card.title}</h3>
                      <p className="mt-3 max-w-[32ch] font-body text-sm font-light leading-snug text-white/90">{card.body}</p>
                    </div>
                  </motion.article>
                ))}
              </div>
            </div>
          </section>
        );
      }

      function App() {
        return (
          <main>
            <Hero />
            <Capabilities />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
