<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astral Voyages Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                heading: ["Instrument Serif", "serif"],
                body: ["Barlow", "sans-serif"],
              },
              borderRadius: {
                DEFAULT: "9999px",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script>window.Motion = window.Motion || window.FramerMotion;</script>
    <style>
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #000; color: #fff; font-family: "Barlow", sans-serif; }
      * { box-sizing: border-box; }
      .liquid-glass {
        background: rgba(255,255,255,0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: none;
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        position: relative;
        overflow: hidden;
      }
      .liquid-glass::before {
        content: "";
        position: absolute; inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .liquid-glass-strong {
        background: rgba(255,255,255,0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(50px);
        -webkit-backdrop-filter: blur(50px);
        border: none;
        box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
        position: relative;
        overflow: hidden;
      }
      .liquid-glass-strong::before {
        content: "";
        position: absolute; inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .chat-scroll { scrollbar-gutter: stable; overscroll-behavior: contain; }
      .chat-scroll::-webkit-scrollbar { width: 6px; }
      .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); border-radius: 9999px; }
      .message-markdown {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .message-markdown p {
        margin: 0 0 0.6rem;
      }
      .message-markdown p:last-child {
        margin-bottom: 0;
      }
      .message-markdown ul,
      .message-markdown ol {
        margin: 0.5rem 0;
        padding-left: 1.25rem;
      }
      .message-markdown ul {
        list-style: disc;
      }
      .message-markdown ol {
        list-style: decimal;
      }
      .message-markdown li {
        margin: 0.25rem 0;
      }
      .message-markdown strong {
        font-weight: 700;
      }
      .message-markdown em {
        font-style: italic;
      }
      .message-markdown code {
        border-radius: 0.35rem;
        background: rgba(255,255,255,0.14);
        padding: 0.1rem 0.3rem;
        font-size: 0.92em;
      }
      .message-markdown pre {
        margin: 0.6rem 0;
        max-width: 100%;
        overflow-x: auto;
        border-radius: 0.75rem;
        background: rgba(0,0,0,0.28);
        padding: 0.75rem;
      }
      .message-markdown pre code {
        background: transparent;
        padding: 0;
      }
      .message-markdown a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;
      const { motion } = window.Motion;

      function ArrowUpRight({ className = "h-5 w-5" }) {
        return (
          <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M7 17L17 7" />
            <path d="M7 7h10v10" />
          </svg>
        );
      }

      function PlayIcon({ className = "h-4 w-4" }) {
        return (
          <svg viewBox="0 0 24 24" className={className} fill="currentColor" aria-hidden="true">
            <polygon points="6 4 20 12 6 20 6 4" />
          </svg>
        );
      }

      function PaperclipIcon({ className = "h-5 w-5" }) {
        return (
          <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
          </svg>
        );
      }

      function MaterialIcon({ path }) {
        return (
          <svg viewBox="0 0 24 24" className="h-6 w-6 text-white" fill="currentColor" aria-hidden="true">
            <path d={path} />
          </svg>
        );
      }

      marked.setOptions({ breaks: true, gfm: true });

      function MessageContent({ text }) {
        const html = DOMPurify.sanitize(marked.parse(text || ""));
        return <div className="message-markdown" dangerouslySetInnerHTML={{ __html: html }} />;
      }

      function MediaVideo({ attachment }) {
        const [failed, setFailed] = useState(false);
        return (
          <div>
            <video controls src={attachment.video_url} poster={attachment.cover || undefined} className="max-h-[360px] w-full bg-black object-contain" preload="metadata" playsInline onError={() => setFailed(true)} />
            {failed && (
              <div className="px-3 py-2 text-xs text-white/70">
                <p>视频预览加载失败。</p>
                {attachment.source_url && (
                  <a href={attachment.source_url} target="_blank" rel="noreferrer" className="mt-1 inline-block underline underline-offset-2">
                    打开原始视频
                  </a>
                )}
              </div>
            )}
          </div>
        );
      }

      function PhotoStack({ images, title, sourceImages }) {
        const [index, setIndex] = useState(0);
        const [dragX, setDragX] = useState(0);
        const [isDragging, setIsDragging] = useState(false);
        const dragStartRef = useRef({ x: 0, time: 0 });
        const count = images.length;
        const stackDirection = dragX > 0 ? -1 : 1;
        const visibleCards = Array.from({ length: Math.min(3, images.length) }, (_, layer) => {
          const imageIndex = (index + layer * stackDirection + count * layer) % count;
          return { src: images[imageIndex], imageIndex, layer };
        });

        if (!count) return null;

        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        function interpolate(start, end, progress) {
          return start + (end - start) * progress;
        }

        function baseCardPose(layer) {
          return {
            x: layer * 14,
            y: layer * 20,
            rotate: layer === 0 ? 0 : layer === 1 ? -4 : 5,
            scale: 1 - layer * 0.055,
          };
        }

        function interpolateCardPose(layer, progress, direction) {
          const current = baseCardPose(layer);
          if (layer === 0) {
            const peakOffset = -Math.sin(progress * Math.PI) * 26;
            return {
              x: dragX,
              y: current.y + peakOffset,
              rotate: (dragX / 18) + direction * progress * 8,
              scale: interpolate(current.scale, 0.9, progress),
            };
          }
          const target = baseCardPose(layer - 1);
          return {
            x: interpolate(current.x, target.x, progress),
            y: interpolate(current.y, target.y, progress),
            rotate: interpolate(current.rotate, target.rotate, progress),
            scale: interpolate(current.scale, target.scale, progress),
          };
        }

        function openImageLink(src, imageIndex) {
          if (Math.abs(dragX) > 8) return;
          const link = (sourceImages || [])[imageIndex] || src;
          window.open(link, "_blank", "noopener,noreferrer");
        }

        function finishDrag() {
          const elapsed = Math.max(performance.now() - dragStartRef.current.time, 1);
          const dragVelocity = dragX / elapsed;
          const shouldFlip = Math.abs(dragX) > 72 || Math.abs(dragVelocity) > 0.5;
          if (shouldFlip && count > 1) {
            setIndex((current) => (current + (dragX < 0 ? 1 : count - 1)) % count);
          }
          setIsDragging(false);
          setDragX(0);
        }

        const dragProgress = count > 1 ? clamp(Math.abs(dragX) / 150, 0, 1) : 0;
        const dragDirection = stackDirection;
        const transitionClass = isDragging ? "" : "transition-transform duration-200 ease-out";

        return (
          <div className="relative mx-auto h-[380px] w-full max-w-[330px] touch-pan-y select-none py-4" onPointerDown={(event) => {
            dragStartRef.current = { x: event.clientX, time: performance.now() };
            setIsDragging(true);
            event.currentTarget.setPointerCapture(event.pointerId);
          }} onPointerMove={(event) => {
            if (!event.currentTarget.hasPointerCapture(event.pointerId)) return;
            setDragX(clamp(event.clientX - dragStartRef.current.x, -150, 150));
          }} onPointerUp={finishDrag} onPointerCancel={() => {
            setIsDragging(false);
            setDragX(0);
          }}>
            {visibleCards.slice().reverse().map(({ src, imageIndex, layer }) => {
              const pose = interpolateCardPose(layer, dragProgress, dragDirection);
              return (
                <button key={`${src}-${layer}`} type="button" onClick={() => openImageLink(src, imageIndex)} className={`absolute inset-x-3 top-4 block overflow-hidden rounded-[1rem] bg-black p-0 text-left shadow-[0_18px_40px_rgba(0,0,0,.35)] ${transitionClass}`} style={{ transform: `translate(${pose.x}px, ${pose.y}px) rotate(${pose.rotate}deg) scale(${pose.scale})`, zIndex: 3 - layer }}>
                  <img src={src} alt={title || "Parsed media"} className="h-[320px] w-full object-cover" loading={layer === 0 ? "eager" : "lazy"} draggable="false" />
                </button>
              );
            })}
            {count > 1 && (
              <div className="absolute bottom-0 left-1/2 z-10 -translate-x-1/2 rounded-full bg-black/45 px-3 py-1 text-xs text-white/75">
                {index + 1}/{count}
              </div>
            )}
          </div>
        );
      }

      function FileAttachment({ attachment }) {
        async function downloadAttachment() {
          const token = window.localStorage.getItem("agent_token") || "";
          const response = await fetch(attachment.download_url, {
            headers: { "Authorization": `Bearer ${token}` },
          });
          if (!response.ok) return;
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = attachment.filename || attachment.title || "converted-file";
          anchor.click();
          URL.revokeObjectURL(url);
        }

        const size = attachment.size_bytes ? `${Math.max(1, Math.round(attachment.size_bytes / 1024))} KB` : "";
        return (
          <div className="flex items-center justify-between gap-3 rounded-[0.8rem] bg-white/10 px-3 py-2">
            <div className="min-w-0">
              <p className="truncate text-sm font-medium text-white">{attachment.filename || attachment.title || "converted-file"}</p>
              <p className="truncate text-xs text-white/55">{attachment.message || attachment.mime_type || size}</p>
            </div>
            {attachment.download_url && (
              <button type="button" onClick={downloadAttachment} className="shrink-0 rounded-full bg-white px-3 py-1.5 text-xs font-semibold text-black">
                下载
              </button>
            )}
          </div>
        );
      }

      function GeneratedImageAttachment({ attachment }) {
        const [imageSrc, setImageSrc] = useState("");
        const [failed, setFailed] = useState(false);

        useEffect(() => {
          let cancelled = false;
          let objectUrl = "";

          async function loadImage() {
            const token = window.localStorage.getItem("agent_token") || "";
            const imageUrl = attachment.image_url || attachment.preview_url || attachment.download_url;
            if (!imageUrl) {
              setFailed(true);
              return;
            }
            try {
              const response = await fetch(imageUrl, {
                headers: { "Authorization": `Bearer ${token}` },
              });
              if (!response.ok) throw new Error(`Image request failed: ${response.status}`);
              const blob = await response.blob();
              objectUrl = URL.createObjectURL(blob);
              if (cancelled) {
                URL.revokeObjectURL(objectUrl);
                return;
              }
              setImageSrc(objectUrl);
            } catch (err) {
              if (!cancelled) setFailed(true);
            }
          }

          loadImage();
          return () => {
            cancelled = true;
            if (objectUrl) URL.revokeObjectURL(objectUrl);
          };
        }, [attachment.image_url, attachment.preview_url, attachment.download_url, attachment.image_id]);

        async function downloadAttachment() {
          const token = window.localStorage.getItem("agent_token") || "";
          const response = await fetch(attachment.download_url || attachment.image_url, {
            headers: { "Authorization": `Bearer ${token}` },
          });
          if (!response.ok) return;
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = attachment.filename || `${attachment.image_id || "generated-image"}.png`;
          anchor.click();
          URL.revokeObjectURL(url);
        }

        return (
          <div>
            {imageSrc ? (
              <img src={imageSrc} alt={attachment.prompt || attachment.title || "Generated image"} className="max-h-[420px] w-full bg-black object-contain" />
            ) : (
              <div className="flex h-[260px] items-center justify-center bg-black/35 px-4 text-center text-xs text-white/60">
                {failed ? "图片预览加载失败。" : "图片加载中..."}
              </div>
            )}
            <div className="flex items-start justify-between gap-3 px-3 py-2 text-xs text-white/70">
              <div className="min-w-0">
                <p className="line-clamp-2">{attachment.prompt || attachment.title || "Generated image"}</p>
                <p className="mt-1 truncate text-white/45">{attachment.model || "image model"} · {attachment.size || "1024x1024"}</p>
              </div>
              {(attachment.download_url || attachment.image_url) && (
                <button type="button" onClick={downloadAttachment} className="shrink-0 rounded-full bg-white px-3 py-1.5 font-semibold text-black">
                  下载
                </button>
              )}
            </div>
          </div>
        );
      }

      function ImageGenerationJobAttachment({ attachment, onReady }) {
        const [status, setStatus] = useState(attachment.status || "queued");
        const [message, setMessage] = useState(attachment.message || "正在生成图片...");

        useEffect(() => {
          if (!attachment.poll_url || status === "ready" || status === "failed") return undefined;
          let cancelled = false;
          let timerId = 0;

          async function pollJob() {
            const token = window.localStorage.getItem("agent_token") || "";
            try {
              const response = await fetch(attachment.poll_url, {
                headers: { "Authorization": `Bearer ${token}` },
              });
              if (!response.ok) throw new Error(`Image job request failed: ${response.status}`);
              const data = await response.json();
              if (cancelled) return;
              setStatus(data.status || "queued");
              setMessage(data.error || data.reply || attachment.message || "正在生成图片...");
              if (data.status === "ready" && data.attachments && data.attachments.length) {
                onReady?.(attachment.job_id, data.attachments, data.reply || "图片已生成。");
                return;
              }
              if (data.status === "failed") return;
              timerId = window.setTimeout(pollJob, 2000);
            } catch (err) {
              if (!cancelled) timerId = window.setTimeout(pollJob, 3000);
            }
          }

          timerId = window.setTimeout(pollJob, 800);
          return () => {
            cancelled = true;
            window.clearTimeout(timerId);
          };
        }, [attachment.job_id, attachment.poll_url, status, onReady]);

        return (
          <div className="rounded-[0.9rem] bg-white/10 px-3 py-3">
            <p className="text-sm font-semibold text-white">{status === "failed" ? "图片生成失败" : "图片生成中"}</p>
            <p className="mt-1 line-clamp-2 text-xs text-white/60">{message || attachment.prompt}</p>
            <div className="mt-3 h-1.5 overflow-hidden rounded-full bg-white/10">
              <div className={`h-full rounded-full bg-white/80 ${status === "running" ? "w-2/3" : "w-1/3"}`} />
            </div>
          </div>
        );
      }

      function MediaAttachments({ attachments, onImageJobReady }) {
        const items = attachments || [];
        if (!items.length) return null;
        return (
          <div className="mt-3 flex flex-col gap-3">
            {items.map((attachment, attachmentIndex) => (
              <div key={`${attachment.media_type || "item"}-${attachment.parse_id || attachment.file_id || attachment.image_id || attachment.job_id || attachmentIndex}`} className="overflow-hidden rounded-[0.9rem] bg-black/25">
                {attachment.media_type === "file" ? (
                  <FileAttachment attachment={attachment} />
                ) : attachment.media_type === "generated_image" ? (
                  <GeneratedImageAttachment attachment={attachment} />
                ) : attachment.media_type === "image_generation_job" ? (
                  <ImageGenerationJobAttachment attachment={attachment} onReady={onImageJobReady} />
                ) : (
                  <>
                    {attachment.media_type === "video" && attachment.video_url && (
                      <MediaVideo attachment={attachment} />
                    )}
                    {attachment.media_type === "image_gallery" && (
                      <PhotoStack images={attachment.images} title={attachment.title} sourceImages={attachment.source_images} />
                    )}
                    {(attachment.title || attachment.author) && (
                      <div className="px-3 py-2 text-xs text-white/70">
                        {attachment.title && <p className="line-clamp-2">{attachment.title}</p>}
                        {attachment.author && <p className="mt-1 text-white/45">{attachment.author}</p>}
                      </div>
                    )}
                  </>
                )}
              </div>
            ))}
          </div>
        );
      }

      function FadingVideo({ src, className, style }) {
        const videoRef = useRef(null);
        const rafRef = useRef(null);
        const fadingOutRef = useRef(false);
        const endedTimerRef = useRef(null);
        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        useEffect(() => {
          const video = videoRef.current;
          if (!video) return;

          function fadeTo(target, duration) {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            const startOpacity = Number.parseFloat(video.style.opacity || "0") || 0;
            const start = performance.now();
            const tick = (now) => {
              const progress = Math.min((now - start) / duration, 1);
              video.style.opacity = String(startOpacity + (target - startOpacity) * progress);
              if (progress < 1) {
                rafRef.current = requestAnimationFrame(tick);
              }
            };
            rafRef.current = requestAnimationFrame(tick);
          }

          function onLoadedData() {
            video.style.opacity = "0";
            video.play();
            fadeTo(1, FADE_MS);
          }

          function onTimeUpdate() {
            if (!video.duration || fadingOutRef.current) return;
            const remaining = video.duration - video.currentTime;
            if (remaining <= FADE_OUT_LEAD && remaining > 0) {
              fadingOutRef.current = true;
              fadeTo(0, FADE_MS);
            }
          }

          function onEnded() {
            video.style.opacity = "0";
            endedTimerRef.current = setTimeout(() => {
              video.currentTime = 0;
              video.play();
              fadingOutRef.current = false;
              fadeTo(1, FADE_MS);
            }, 100);
          }

          video.addEventListener("loadeddata", onLoadedData);
          video.addEventListener("timeupdate", onTimeUpdate);
          video.addEventListener("ended", onEnded);
          if (video.readyState >= 2) onLoadedData();

          return () => {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            if (endedTimerRef.current) clearTimeout(endedTimerRef.current);
            video.removeEventListener("loadeddata", onLoadedData);
            video.removeEventListener("timeupdate", onTimeUpdate);
            video.removeEventListener("ended", onEnded);
          };
        }, [src]);

        return <video ref={videoRef} src={src} className={className} style={{ ...style, opacity: 0 }} autoPlay muted playsInline preload="auto" />;
      }

      function BlurText({ text, className }) {
        const ref = useRef(null);
        const [visible, setVisible] = useState(false);
        const words = text.split(" ");

        useEffect(() => {
          const node = ref.current;
          if (!node) return;
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          }, { threshold: 0.1 });
          observer.observe(node);
          return () => observer.disconnect();
        }, []);

        return (
          <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
            {words.map((word, index) => (
              <motion.span
                key={`${word}-${index}`}
                initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
                animate={visible ? {
                  filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                  opacity: [0, 0.5, 1],
                  y: [50, -5, 0],
                } : {}}
                transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: index * 0.1 }}
                style={{ display: "inline-block", marginRight: "0.28em" }}
              >
                {word}
              </motion.span>
            ))}
          </p>
        );
      }

      function ChatPanel() {
        const greeting = { role: "assistant", text: "Mission control is online. Ask about LangGraph, voyages, or your next build." };
        const [token, setToken] = useState(() => window.localStorage.getItem("agent_token") || "");
        const [threadId, setThreadId] = useState(() => window.localStorage.getItem("agent_thread_id") || "");
        const [authMode, setAuthMode] = useState("login");
        const [username, setUsername] = useState("");
        const [password, setPassword] = useState("");
        const [displayName, setDisplayName] = useState("");
        const [messages, setMessages] = useState([]);
        const [uploadedFiles, setUploadedFiles] = useState([]);
        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const [uploading, setUploading] = useState(false);
        const [error, setError] = useState("");
        const listRef = useRef(null);
        const fileInputRef = useRef(null);

        useEffect(() => {
          if (!token || threadId) return;
          let cancelled = false;

          async function createThread() {
            try {
              const response = await fetch("/threads", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ title: "Default chat" }),
              });
              if (!response.ok) throw new Error(`Thread request failed: ${response.status}`);
              const data = await response.json();
              if (cancelled) return;
              window.localStorage.setItem("agent_thread_id", data.id);
              setThreadId(data.id);
            } catch (err) {
              if (!cancelled) setError("Session setup failed. Please sign in again.");
            }
          }

          createThread();
          return () => {
            cancelled = true;
          };
        }, [token, threadId]);

        useEffect(() => {
          if (!token || !threadId) {
            setMessages(token ? [] : [greeting]);
            return;
          }
          let cancelled = false;

          async function loadHistory() {
            try {
              const response = await fetch(`/chat/${threadId}`, {
                headers: { "Authorization": `Bearer ${token}` },
              });
              if (!response.ok) throw new Error(`History request failed: ${response.status}`);
              const data = await response.json();
              if (cancelled) return;
              setMessages(data.messages && data.messages.length ? data.messages : [greeting]);
            } catch (err) {
              if (!cancelled) setMessages([greeting]);
            }
          }

          loadHistory();
          return () => {
            cancelled = true;
          };
        }, [token, threadId]);

        useEffect(() => {
          if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
        }, [messages, loading]);

        async function readErrorMessage(response) {
          try {
            const data = await response.json();
            return data.detail || data.error || `Chat request failed: ${response.status}`;
          } catch (err) {
            return `Chat request failed: ${response.status}`;
          }
        }

        function uploadedFileAttachment(file) {
          const downloadUrl = `/documents/files/${file.file_id}/download`;
          return {
            platform: "document",
            media_type: "file",
            title: file.filename,
            file_id: file.file_id,
            filename: file.filename,
            mime_type: file.mime_type,
            download_url: downloadUrl,
            preview_url: downloadUrl,
            size_bytes: file.size_bytes,
            status: "uploaded",
            message: "已上传，等待处理。",
          };
        }

        async function uploadFiles(event) {
          const selectedFiles = Array.from(event.target.files || []);
          event.target.value = "";
          if (!selectedFiles.length || !token) return;
          setUploading(true);
          setError("");

          try {
            const uploaded = [];
            for (const selectedFile of selectedFiles) {
              const formData = new FormData();
              formData.append("file", selectedFile);
              const response = await fetch("/files/upload", {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` },
                body: formData,
              });
              if (!response.ok) {
                const message = await readErrorMessage(response);
                throw new Error(message);
              }
              uploaded.push(await response.json());
            }
            setUploadedFiles((current) => [...current, ...uploaded]);
          } catch (err) {
            setError(err.message || "文件上传失败。");
          } finally {
            setUploading(false);
          }
        }

        async function sendMessage(event) {
          event.preventDefault();
          const text = input.trim();
          if (!text || loading || uploading || !token || !threadId) return;
          const filesForMessage = uploadedFiles;
          setInput("");
          setError("");
          setMessages((current) => [
            ...current,
            {
              role: "user",
              text,
              attachments: filesForMessage.map(uploadedFileAttachment),
            },
          ]);
          setLoading(true);

          try {
            const response = await fetch("/chat", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                thread_id: threadId,
                message: text,
                file_ids: filesForMessage.map((file) => file.file_id),
              }),
            });
            if (!response.ok) {
              const message = await readErrorMessage(response);
              throw new Error(message);
            }
            const data = await response.json();
            setMessages((current) => [
              ...current,
              {
                role: "assistant",
                text: data.reply || "No reply returned.",
                attachments: data.attachments || [],
              },
            ]);
            setUploadedFiles([]);
          } catch (err) {
            const message = err.message || "请求失败，请检查后端服务。";
            setError(message);
          } finally {
            setLoading(false);
          }
        }

        function handleImageJobReady(jobId, attachments, reply) {
          setMessages((current) =>
            current.map((message) => {
              const existingAttachments = message.attachments || [];
              if (!existingAttachments.some((attachment) => attachment.job_id === jobId)) return message;
              return {
                ...message,
                text: reply || message.text,
                attachments: existingAttachments.flatMap((attachment) =>
                  attachment.job_id === jobId ? attachments : [attachment]
                ),
              };
            })
          );
        }

        async function submitAuth(event) {
          event.preventDefault();
          setLoading(true);
          setError("");

          try {
            const response = await fetch(authMode === "login" ? "/auth/login" : "/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: username.trim(),
                password,
                display_name: displayName.trim() || undefined,
              }),
            });
            if (!response.ok) throw new Error(`Auth request failed: ${response.status}`);
            const data = await response.json();
            window.localStorage.setItem("agent_token", data.token);
            window.localStorage.removeItem("agent_thread_id");
            setToken(data.token);
            setThreadId("");
            setMessages([]);
          } catch (err) {
            setError(authMode === "login" ? "Sign in failed." : "Registration failed.");
          } finally {
            setLoading(false);
          }
        }

        return (
          <motion.aside
            id="chat"
            data-testid="chat-panel"
            initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
            whileInView={{ filter: "blur(0px)", opacity: 1, y: 0 }}
            viewport={{ once: true, amount: 0.2 }}
            transition={{ duration: 0.75, ease: "easeOut", delay: 0.2 }}
            className="liquid-glass-strong flex h-[calc(100dvh-2rem)] max-h-[calc(100dvh-2rem)] w-full max-w-[630px] flex-col rounded-[1.5rem] p-4 text-left"
          >
            <div className="mb-3 flex shrink-0 items-center justify-between">
              <div>
                <p className="font-body text-xs font-medium uppercase tracking-[0.18em] text-white/60">AI Mission Console</p>
                <h2 className="font-heading text-3xl italic leading-[1.1] text-white">Ask the agent</h2>
              </div>
              <div className="liquid-glass flex h-10 w-10 items-center justify-center rounded-full text-white">
                <ArrowUpRight className="h-5 w-5" />
              </div>
            </div>
            <div ref={listRef} className="chat-scroll flex flex-1 min-h-0 flex-col gap-3 overflow-y-auto pr-1">
              {!token ? (
                <form onSubmit={submitAuth} className="liquid-glass mt-8 flex flex-col gap-3 rounded-[1.1rem] p-4">
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setAuthMode("login")} className={`rounded-full px-4 py-2 text-sm ${authMode === "login" ? "bg-white text-black" : "liquid-glass text-white"}`}>Sign in</button>
                    <button type="button" onClick={() => setAuthMode("register")} className={`rounded-full px-4 py-2 text-sm ${authMode === "register" ? "bg-white text-black" : "liquid-glass text-white"}`}>Register</button>
                  </div>
                  <input value={username} onChange={(event) => setUsername(event.target.value)} placeholder="Username" className="liquid-glass rounded-full px-4 py-3 text-sm text-white outline-none placeholder:text-white/45" />
                  <input value={password} onChange={(event) => setPassword(event.target.value)} type="password" placeholder="Password" className="liquid-glass rounded-full px-4 py-3 text-sm text-white outline-none placeholder:text-white/45" />
                  {authMode === "register" && <input value={displayName} onChange={(event) => setDisplayName(event.target.value)} placeholder="Display name" className="liquid-glass rounded-full px-4 py-3 text-sm text-white outline-none placeholder:text-white/45" />}
                  <button type="submit" disabled={loading} className="rounded-full bg-white px-4 py-3 text-sm font-semibold text-black disabled:opacity-55">{authMode === "login" ? "Sign in" : "Create account"}</button>
                </form>
              ) : (
                <>
                  {messages.map((message, index) => (
                    <div key={`${message.role}-${index}`} className={`shrink-0 max-w-[86%] rounded-[1.1rem] px-4 py-3 font-body text-sm leading-snug ${message.role === "user" ? "ml-auto bg-white text-black" : "liquid-glass text-white/95"}`}>
                      <MessageContent text={message.text} />
                      <MediaAttachments attachments={message.attachments} onImageJobReady={handleImageJobReady} />
                    </div>
                  ))}
                  {!threadId && <div className="liquid-glass shrink-0 max-w-[72%] rounded-[1.1rem] px-4 py-3 font-body text-sm text-white/80">Preparing secure session...</div>}
                  {loading && <div className="liquid-glass shrink-0 max-w-[72%] rounded-[1.1rem] px-4 py-3 font-body text-sm text-white/80">Receiving signal...</div>}
                </>
              )}
            </div>
            {error && <p className="mt-3 font-body text-xs text-white/80">{error}</p>}
            {uploadedFiles.length > 0 && (
              <div className="mt-3 flex shrink-0 flex-wrap gap-2">
                {uploadedFiles.map((file) => (
                  <span key={file.file_id} className="liquid-glass max-w-full truncate rounded-full px-3 py-1.5 text-xs text-white/75">
                    {file.filename}
                  </span>
                ))}
              </div>
            )}
            <form onSubmit={sendMessage} className="mt-4 flex shrink-0 items-center gap-2">
              <input ref={fileInputRef} type="file" multiple className="hidden" onChange={uploadFiles} />
              <button type="button" title="Attach files" onClick={() => fileInputRef.current?.click()} disabled={loading || uploading || !token} className="liquid-glass flex h-12 w-12 shrink-0 items-center justify-center rounded-full text-white disabled:opacity-55">
                <PaperclipIcon className="h-5 w-5" />
              </button>
              <input
                value={input}
                onChange={(event) => setInput(event.target.value)}
                placeholder="Ask about LangGraph or memory..."
                className="liquid-glass min-w-0 flex-1 rounded-full px-4 py-3 font-body text-sm text-white outline-none placeholder:text-white/45 focus:shadow-[inset_0_0_0_1px_rgba(255,255,255,.35)]"
              />
              <button type="submit" disabled={loading || uploading} className="liquid-glass-strong flex h-12 w-12 shrink-0 items-center justify-center rounded-full text-white disabled:opacity-55">
                <ArrowUpRight className="h-5 w-5" />
              </button>
            </form>
          </motion.aside>
        );
      }

      function Hero() {
        return (
          <section id="hero" className="relative flex min-h-[100dvh] overflow-hidden bg-black">
            <FadingVideo
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"
              className="absolute left-1/2 top-0 z-0 -translate-x-1/2 object-cover object-top"
              style={{ width: "120%", height: "120%" }}
            />
            <div className="relative z-10 flex min-h-[100dvh] w-full flex-col">
              <div className="hero-chat-center flex flex-1 items-center justify-center px-4 py-4">
                <div className="flex w-full max-w-[690px] justify-center">
                  <ChatPanel />
                </div>
              </div>
            </div>
          </section>
        );
      }

      function App() {
        return (
          <main>
            <Hero />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
