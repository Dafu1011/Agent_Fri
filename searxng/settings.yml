use_default_settings: true

general:
  instance_name: "Agent Local Search"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: "http://localhost:8080/"
  limiter: false
  public_instance: false
  secret_key: "local-development-secret-change-me"
  image_proxy: false
  method: "GET"

ui:
  default_theme: simple
  query_in_title: false

engines:
  - name: bing
    disabled: false

  - name: brave
    disabled: true

  - name: duckduckgo
    disabled: true

  - name: google cse
    disabled: true

  - name: startpage
    disabled: true
